[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "radioshack-26-950-scale"
version = "1.0.0"
description = "Driver and CLI for the RadioShack 26-950 USB postal scale"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-3.0-or-later" }
dependencies = ["hidapi>=0.14.0"]
keywords = ["hid", "usb", "scale", "radioshack", "postal", "weight"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Hardware :: Hardware Drivers",
]

[project.urls]
Homepage = "https://github.com/Z3r0XG/RadioShack-26-950-HID-Scale"
Issues = "https://github.com/Z3r0XG/RadioShack-26-950-HID-Scale/issues"

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4"]

[project.scripts]
radioshack-scale = "read_scale:main"

[tool.setuptools]
py-modules = ["read_scale"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "I"]
